[project]
name = "voxen"
version = "0.1.0"
description = "Fast, fully local Windows equivalent of Wispr Flow"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Voxen Team" }
]
dependencies = [
    "faster-whisper>=1.0.0",
    "numpy>=1.26.0",
    "pynput>=1.8.0",
    "pyside6>=6.6.0",
    "pywin32>=306",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "sounddevice>=0.4.6",
]

[project.scripts]
voxen = "voxen.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voxen"]
include = [
    "config.yaml",
]

[tool.uv]
managed = true
