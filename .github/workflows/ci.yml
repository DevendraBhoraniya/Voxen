name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Sync dependencies (including test extra)
        run: uv sync --extra test

      - name: Compile all Python files
        run: uv run python -m compileall -q voxen tests tools

      - name: Run test suite
        env:
          CI: true
        run: uv run pytest tests/ -rs -q
